rentgg:
  jobs:
    enabled: false
  rate-limit:
    login-per-minute: 1000
    login-per-hour: 10000
    register-per-hour: 10000
    otp-per-hour: 5
    orders-per-hour: 10000
  credentials:
    keys: testkey:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    active-key-id: testkey
  security:
    jwt-secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtcmVudGdnLTMyLWJ5dGVzLW1pbiE=
  payment:
    webhook-secret: test-only-webhook-secret-rentgg-0123456789
    provider: FAKE
    fake-enabled: true
    vnpay:
      tmn-code: TESTTMN1
      hash-secret: TESTVNPAYHASHSECRET0123456789ABCD
    zalopay:
      app-id: "2553"
      key1: test-zalopay-key1
      key2: test-zalopay-key2
      # Closed loopback port: a provider call in the default context fails fast and never reaches a real sandbox.
      endpoint: http://127.0.0.1:1
    payos:
      client-id: test-payos-client-id
      api-key: test-payos-api-key
      checksum-key: test-payos-checksum-key
      endpoint: http://127.0.0.1:1
    momo:
      partner-code: TESTMOMOPARTNER
      access-key: test-momo-access-key
      secret-key: test-momo-secret-key
      endpoint: http://127.0.0.1:1

spring:
  flyway:
    clean-disabled: false
  datasource:
    hikari:
      # Each cached test context keeps its own pool; keep them small so CI's postgres max_connections (100) holds.
      maximum-pool-size: 8
      minimum-idle: 2

logging:
  level:
    com.rentgg: WARN
