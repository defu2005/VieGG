# Kiểm tra kiểu và build web (Vite) mỗi lần đẩy code frontend.
name: Web

on:
  push:
    paths: ["frontend/**", "deploy/web.Dockerfile", "deploy/Caddyfile", ".github/workflows/web.yml"]
  pull_request:
    paths: ["frontend/**", "deploy/web.Dockerfile", "deploy/Caddyfile", ".github/workflows/web.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Validate Caddyfile
        working-directory: deploy
        run: docker run --rm -e RENTGG_DOMAIN=example.com -e ACME_EMAIL=ci@example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
