# Triển khai lên VPS: bấm "Run workflow" trên tab Actions (không tự chạy khi push).
# Cần 3 secret của repo: DEPLOY_HOST (IP VPS), DEPLOY_USER, DEPLOY_SSH_KEY (khóa riêng SSH dành riêng cho deploy).
# Trên VPS, repo được clone sẵn tại ~/rentgg và có deploy/.env.prod (xem docs/RentGG_Production_Deploy.md).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Nhánh/tag/commit cần triển khai"
        default: main
        required: true

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Deploy qua SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REF: ${{ inputs.ref }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REF
          command_timeout: 25m
          script: |
            set -eu
            cd ~/rentgg
            git fetch --all --tags --prune
            git checkout --detach "$REF" 2>/dev/null || git checkout --detach "origin/$REF"
            cd deploy
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker image prune -f
            for i in $(seq 1 60); do
              if docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T caddy \
                   wget -qO- http://app:8080/actuator/health | grep -q '"UP"'; then
                echo "Backend UP"; exit 0
              fi
              sleep 5
            done
            echo "Backend không lên sau 5 phút"; docker compose -f docker-compose.prod.yml logs --tail 100 app; exit 1
