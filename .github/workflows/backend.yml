# Test backend (Spring Boot) trên Postgres 16 mỗi lần đẩy code backend.
name: Backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rentgg_test
          POSTGRES_USER: rentgg
          POSTGRES_PASSWORD: rentgg_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rentgg -d rentgg_test"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/rentgg_test
          TEST_DB_USERNAME: rentgg
          TEST_DB_PASSWORD: rentgg_dev
        run: ./mvnw -B test
      - name: Build image
        run: docker build -t rentgg-backend:${{ github.sha }} .
