# Sinh RentGG.xcodeproj bằng XcodeGen: `brew install xcodegen && xcodegen generate` (trong thư mục ios/).
name: RentGG

options:
  bundleIdPrefix: com.rentgg
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    # Chế độ ngôn ngữ Swift 5 (Xcode chỉ nhận 4.0, 4.2, 5.0, 6.0).
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: vi

configs:
  Debug: debug
  Release: release

packages:
  RentGGCore:
    path: RentGGCore

targets:
  RentGG:
    type: application
    platform: iOS
    sources:
      - path: RentGG
    dependencies:
      - package: RentGGCore
    info:
      path: RentGG/Info.plist
      properties:
        CFBundleDisplayName: VieGG
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: vi
        # Lấy từ build setting theo cấu hình (xem bên dưới), đọc trong UI/AppState.swift.
        APIBaseURL: $(API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Cho phép HTTP tới localhost và IP LAN khi phát triển (tương đương network_security_config
        # debug bên Android). Domain công khai vẫn bắt buộc HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rentgg.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          # 10.0.2.2 bên Android là máy host khi chạy emulator. Simulator iOS dùng localhost.
          # Chạy trên iPhone thật: đổi sang IP LAN của máy chạy backend, ví dụ http://192.168.1.10:8080/api/v1/
          API_BASE_URL: http://localhost:8080/api/v1/
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          # Đổi sang domain thật trước khi phát hành.
          API_BASE_URL: https://api.rentgg.example/api/v1/

schemes:
  RentGG:
    build:
      targets:
        RentGG: all
    run:
      config: Debug
    archive:
      config: Release
